<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            text-align: center;
            padding: 50px;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.2);

            /* Card animation */
            animation: fadeIn 1.5s ease-in-out;
        }

        h1 {
            color: #2c3e50;

            /* Heading animation */
            animation: slideDown 1s ease;
        }

        p {
            color: #555;
            font-size: 18px;

            animation: fadeIn 2s ease;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;

            transition: transform 0.3s, background-color 0.3s;
        }

        /* Button hover animation */
        button:hover {
            background-color: #2980b9;
            transform: scale(1.1);
        }


        /* Card fade animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* Heading slide animation */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Welcome to My Website 🚀</h1>

        <p>
            This is a simple animated website running on Flask and AWS EC2.
        </p>

        <button>
            Get Started
        </button>

    </div>

</body>
</html>
